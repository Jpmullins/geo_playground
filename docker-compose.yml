services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: geodb
      POSTGRES_USER: geouser
      POSTGRES_PASSWORD: geopass
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U geouser -d geodb"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "16379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  telemetry-gateway:
    build:
      context: ./services/telemetry-gateway
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8080"
      CENTER_LAT: "37.7749"
      CENTER_LON: "-122.4194"
      RADIUS_KM: "80"
      POLL_INTERVAL_MS: "5000"
      ADSB_PROVIDER: "adsbfi"
      DATABASE_URL: "postgres://geouser:geopass@postgres:5432/geodb"
      REDIS_URL: "redis://redis:6379"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
      OTEL_SERVICE_NAME: "telemetry-gateway"
    ports:
      - "18080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  agent-runtime:
    build:
      context: ./services/agent-runtime
    env_file:
      - path: .env
        required: false
    environment:
      PORT: "8090"
      TELEMETRY_API_BASE: "http://telemetry-gateway:8080"
      LITELLM_BASE_URL: "${LITELLM_BASE_URL:-https://gateway.insights.arlis.umd.edu/v1}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
      OTEL_SERVICE_NAME: "geo-agent-runtime"
      MLFLOW_TRACKING_URI: "${MLFLOW_TRACKING_URI:-sqlite:////mlruns/mlflow.db}"
      MLFLOW_EXPERIMENT: "geo-playground-agent"
    ports:
      - "18090:8090"
    volumes:
      - mlruns:/mlruns
    depends_on:
      - telemetry-gateway
    restart: unless-stopped

  copilot-runtime:
    build:
      context: ./services/copilot-runtime
    environment:
      PORT: "8091"
      AGENT_AGUI_URL: "http://agent-runtime:8090/agui"
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}"
      OTEL_SERVICE_NAME: "copilot-runtime"
    ports:
      - "18091:8091"
    depends_on:
      - agent-runtime
    restart: unless-stopped

  exec-broker:
    build:
      context: ./services/exec-broker
    environment:
      PORT: "8081"
      CMD_TIMEOUT_MS: "10000"
      MAX_OUTPUT_BYTES: "16384"
    ports:
      - "18081:8081"
    restart: unless-stopped

  search-proxy:
    build:
      context: ./services/search-proxy
    environment:
      PORT: "8082"
      SEARCH_PROVIDER: "duckduckgo"
    ports:
      - "18082:8082"
    restart: unless-stopped

  ui:
    build:
      context: ./services/ui
    environment:
      PORT: "3000"
      TELEMETRY_API_BASE: "http://telemetry-gateway:8080"
      COPILOT_RUNTIME_BASE: "http://copilot-runtime:8091"
    ports:
      - "3010:3000"
    restart: unless-stopped
    depends_on:
      - telemetry-gateway
      - copilot-runtime

  otel-collector:
    image: otel/opentelemetry-collector:0.115.0
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./deploy/otel-collector-config.yaml:/etc/otel-collector-config.yaml:ro
    restart: unless-stopped

volumes:
  pgdata:
  mlruns:
