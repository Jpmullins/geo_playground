# OTLP collector for local geo_playground observability.
# Receives OTLP from the instrumented services and fans out to:
#   - `debug`: prints spans to the collector log (docker compose logs otel-collector)
#   - `otlp/jaeger`: forwards to Jaeger all-in-one, which stores traces and serves
#     a queryable API on :16686 (used by an external harness's telemetry adapter).
receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  batch: {}

exporters:
  debug:
    verbosity: normal
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug, otlp/jaeger]
